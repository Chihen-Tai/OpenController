name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore XboxControllerCenter.slnx

      - name: Build (Release)
        run: dotnet build XboxControllerCenter.slnx -c Release --no-restore -warnaserror

      - name: Unit tests
        run: dotnet test tests/XboxControllerCenter.Core.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Package portable ZIP
        shell: pwsh
        run: ./build/publish.ps1 -SkipTests

      - uses: actions/upload-artifact@v4
        with:
          name: XboxControllerCenter-win-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
