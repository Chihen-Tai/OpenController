name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Restore with the Release configuration: the app is self-contained only in Release,
      # so a default (Debug) restore would not download the Windows desktop runtime pack.
      - name: Restore
        run: dotnet restore OpenController.slnx -p:Configuration=Release

      - name: Build (Release)
        run: dotnet build OpenController.slnx -c Release --no-restore -warnaserror

      - name: Unit tests
        run: dotnet test tests/OpenController.Core.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Package portable ZIP
        shell: pwsh
        run: ./build/publish.ps1 -SkipTests

      - uses: actions/upload-artifact@v7
        with:
          name: OpenController-win-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore
